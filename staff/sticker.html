<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parcel stickers · All Seazons</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    @page { size: 100mm 150mm; margin: 0; }
    body { background: #e9e5e7; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 16px; }
    .bar p { margin: 0; color: var(--ink-2); font-size: 14px; }
    .labels { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 16px 30px; }
    .label {
      width: 100mm; height: 150mm; background: #fff; color: #000; padding: 6mm;
      display: flex; flex-direction: column; gap: 3mm; overflow: hidden;
      border: 0.4mm solid #000; font-family: var(--body);
    }
    .label .top { display: flex; justify-content: space-between; align-items: center; }
    .label .top img { width: 30mm; height: auto; }
    .label .code { font: 700 7mm var(--display); }
    .label .to { font-size: 3.4mm; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-top: 2mm; }
    .label .name { font: 700 9mm/1.05 var(--display); word-break: break-word; }
    .label .phone { font: 600 6mm var(--display); }
    .label .dest { background: #000; color: #fff; padding: 3mm 4mm; border-radius: 2mm; font: 700 8mm/1.1 var(--display); text-transform: uppercase; }
    .label .dest small { display: block; font: 600 4mm var(--body); text-transform: none; margin-top: 1mm; }
    .label .addr { font-size: 4.4mm; line-height: 1.3; max-height: 30mm; overflow: hidden; }
    .label .meta { margin-top: auto; display: flex; justify-content: space-between; font-size: 3.6mm; border-top: 0.4mm dashed #000; padding-top: 2mm; }
    .label .from { font-size: 3.2mm; color: #333; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .labels { padding: 0; gap: 0; display: block; }
      .label { border: 0; page-break-after: always; break-after: page; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <button class="btn" onclick="window.print()">Print</button>
    <p>Stickers are 100 × 150 mm (4 × 6 inch shipping labels). For A4 paper, choose “Fit to page” or print 4 per sheet in the print settings.</p>
  </div>
  <div class="labels" id="labels"><p style="padding:16px">Loading…</p></div>
  <script type="module">
    import { supabase } from '../assets/js/db.js';
    import { esc, METHOD_LABEL, kwacha } from '../assets/js/lib.js';

    const ids = (new URLSearchParams(location.search).get('ids') || '').split(',').filter(Boolean);
    const out = document.getElementById('labels');
    const [{ data: orders, error }, { data: settings }] = await Promise.all([
      supabase.from('orders').select('*').in('id', ids),
      supabase.from('settings').select('shop_name, whatsapp_number').eq('id', 1).maybeSingle(),
    ]);
    if (error || !orders?.length) {
      out.innerHTML = '<p style="padding:16px">No orders found. Make sure you are signed in to the staff app in this browser.</p>';
    } else {
      orders.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      out.innerHTML = orders.map((o) => {
        const dest = o.delivery_method === 'courier' ? o.town : o.delivery_method === 'pickup' ? 'Pickup' : 'Lusaka';
        const how = o.delivery_method === 'courier'
          ? `Courier${o.courier ? ': ' + o.courier : ''} · ${o.parcel_size || ''} parcel`
          : METHOD_LABEL[o.delivery_method] || '';
        return `
          <section class="label">
            <div class="top"><img src="../assets/img/logo.svg" alt=""><span class="code">${esc(o.code)}</span></div>
            <div class="to">Deliver to</div>
            <div class="name">${esc(o.customer_name)}</div>
            ${o.phone ? `<div class="phone">${esc(o.phone)}</div>` : ''}
            <div class="dest">${esc(dest)}<small>${esc(how)}</small></div>
            ${o.address ? `<div class="addr">${esc(o.address)}</div>` : ''}
            <div class="meta"><span>${o.item_count} item${o.item_count === 1 ? '' : 's'} · ${kwacha(o.total)}</span><span>${new Date(o.paid_at || o.created_at).toLocaleDateString('en-GB')}</span></div>
            <div class="from">From: ${esc(settings?.shop_name || 'All Seazons Play')} · ${esc(settings?.whatsapp_number || '')}</div>
          </section>`;
      }).join('');
    }
  </script>
</body>
</html>
