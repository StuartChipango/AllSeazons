<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>All Seazons Play · Pre-loved and new toys in Zambia</title>
  <meta name="description" content="Quality pre-loved and new toys from K30. Shop online and order on WhatsApp. Pickup or Yango delivery in Lusaka, courier to towns across Zambia.">
  <meta property="og:title" content="All Seazons Play">
  <meta property="og:description" content="Pre-loved and new toys from K30. Order on WhatsApp.">
  <meta property="og:image" content="assets/img/og.png">
  <meta name="theme-color" content="#fff8ee">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
  <div class="announce" id="announce" hidden></div>

  <header class="top">
    <a class="brand" href="./" aria-label="All Seazons Play home"><img src="assets/img/logo.svg" alt="All Seazons" width="120" height="63"></a>
    <label class="search">
      <span class="sr-only">Search toys</span>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input type="search" id="search" placeholder="Type a toy: teddy, car…" autocomplete="off">
    </label>
    <a class="wa-btn" id="topWa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>
      <span>Help</span>
    </a>
  </header>

  <main class="wrap">
    <!-- How buying works, in one short line. -->
    <ol class="steps" aria-label="How to buy">
      <li><b>1</b>Tap <u>Buy</u></li>
      <li><b>2</b>Send on WhatsApp</li>
      <li><b>3</b>Then pay</li>
    </ol>

    <!-- Small filters: "All toys" stays put, the toy types slide sideways. -->
    <section class="choose" id="choose" aria-label="Find a toy">
      <div class="chip-line">
        <div id="allChip"></div>
        <div class="slider">
          <div class="chips" id="cats" role="group" aria-label="Kind of toy"></div>
          <button type="button" class="slide-arrow" data-scroller="cats" aria-label="More kinds of toy" hidden>›</button>
        </div>
      </div>
      <div class="chip-line second">
        <div class="slider">
          <div class="chips" id="who" role="group" aria-label="Who is the toy for?"></div>
          <button type="button" class="slide-arrow" data-scroller="who" aria-label="More choices" hidden>›</button>
        </div>
      </div>
      <div class="more-panel" id="moreChoices" hidden>
        <div class="pick-group"><h3>Age</h3><div class="taps" data-pick="age"></div></div>
        <div class="pick-group"><h3>My budget</h3><div class="taps" data-pick="band"></div></div>
        <div class="pick-group"><h3>Used or new</h3><div class="taps" data-pick="condition"></div></div>
        <div class="pick-group"><h3>Show first</h3><div class="taps" data-pick="sort"></div></div>
      </div>
    </section>

    <p class="status" id="status">Loading toys…</p>
    <div id="sections" aria-live="polite"></div>
  </main>

  <!-- "There are more toys below": tap to scroll. Sits above the order bar. -->
  <button type="button" class="more-below" id="moreBelow" hidden aria-label="Scroll down to see more toys">
    <span>More toys</span>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <button class="cart-bar" id="cartBtn" hidden aria-label="Open my order and finish it">
    <span class="cart-words"><span><span id="cartCount">0</span> <span id="cartWord">toys</span> in my order</span><small>Tap here to finish</small></span>
    <span class="cart-total" id="cartTotal"></span>
  </button>

  <footer class="foot">
    <img src="assets/img/logo.svg" alt="" width="90" height="47">
    <p>All Seazons Play · Lusaka, Zambia</p>
    <p class="policy" id="footPolicy"></p>
    <a class="wa-big" id="footWa" href="#" target="_blank" rel="noopener">
      <span class="wa-bubble"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg></span>
      <span><b>Chat with us on WhatsApp</b><small>Ask about any toy. We reply fast!</small></span>
    </a>
  </footer>

  <!-- Toy details -->
  <dialog class="sheet" id="toyDialog" aria-labelledby="toyTitle">
    <button class="close" data-close aria-label="Close">×</button>
    <div id="toyBody"></div>
  </dialog>

  <!-- Cart and checkout -->
  <dialog class="sheet drawer" id="cartDialog" aria-labelledby="cartTitle">
    <button class="close" data-close aria-label="Close">×</button>
    <div id="cartBody"></div>
  </dialog>

  <script type="module" src="assets/js/shop.js"></script>
</body>
</html>
