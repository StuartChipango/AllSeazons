<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>All Seazons Play · Pre-loved and new toys in Zambia</title>
  <meta name="description" content="Quality pre-loved and new toys from K30. Shop online and order on WhatsApp. Pickup or Yango delivery in Lusaka, courier to towns across Zambia.">
  <meta property="og:title" content="All Seazons Play">
  <meta property="og:description" content="Pre-loved and new toys from K30. Order on WhatsApp.">
  <meta property="og:image" content="assets/img/og.png">
  <meta name="theme-color" content="#fff8ee">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
  <div class="announce" id="announce" hidden></div>

  <header class="top">
    <a class="brand" href="./" aria-label="All Seazons Play home"><img src="assets/img/logo.svg" alt="All Seazons" width="120" height="63"></a>
    <label class="search">
      <span class="sr-only">Search toys</span>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input type="search" id="search" placeholder="Search teddy, car, blocks…" autocomplete="off">
    </label>
    <a class="wa-btn" id="topWa" href="#" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.7 7.1L4 20l1-4A8 8 0 1 1 20 12z"/></svg>
    </a>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Quality toys from K30</h1>
      <p>Tap <b>+</b> on the toys you like, then send your order on WhatsApp. Delivery to every town.</p>
      <img class="mascot" src="assets/img/mascots/sammy.webp" alt="" width="98" height="120" decoding="async" fetchpriority="low">
    </section>

    <div class="filters" id="filters">
      <div class="chips" id="audienceChips" aria-label="Who is it for"></div>
      <div class="chips" id="ageChips" aria-label="Age"></div>
      <div class="likes" id="likes" aria-label="What they like"></div>
    </div>

    <div class="bar-row">
      <nav class="tabs" role="tablist" aria-label="Shop sections">
        <button role="tab" class="tab" data-view="shop" aria-selected="true">In stock <span id="countShop"></span></button>
        <button role="tab" class="tab" data-view="specials" aria-selected="false">Specials <span id="countSpecials"></span></button>
        <button role="tab" class="tab" data-view="sold" aria-selected="false">Sold <span id="countSold"></span></button>
      </nav>
      <details class="more-filters" id="moreFilters">
        <summary>Filters</summary>
        <div class="more-body">
          <div class="chips" id="conditionChips" aria-label="Condition"></div>
          <div class="chips" id="priceChips" aria-label="Price"></div>
          <select id="sort" aria-label="Sort">
            <option value="new">Newest first</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </div>
      </details>
    </div>

    <p class="sold-intro" id="soldIntro" hidden></p>
    <p class="status" id="status">Loading toys…</p>
    <div class="grid" id="grid" aria-live="polite"></div>
  </main>

  <button class="cart-bar" id="cartBtn" hidden aria-label="Open my list and check out">
    <span><span id="cartCount">0</span> <span id="cartWord">toys</span> picked</span>
    <span class="cart-total" id="cartTotal"></span>
  </button>

  <footer class="foot">
    <img src="assets/img/logo.svg" alt="" width="90" height="47">
    <p>All Seazons Play · Lusaka, Zambia</p>
    <p><a id="footWa" href="#">Chat with us on WhatsApp</a></p>
  </footer>

  <!-- Toy details -->
  <dialog class="sheet" id="toyDialog" aria-labelledby="toyTitle">
    <button class="close" data-close aria-label="Close">×</button>
    <div id="toyBody"></div>
  </dialog>

  <!-- Cart and checkout -->
  <dialog class="sheet drawer" id="cartDialog" aria-labelledby="cartTitle">
    <button class="close" data-close aria-label="Close">×</button>
    <div id="cartBody"></div>
  </dialog>

  <script type="module" src="assets/js/shop.js"></script>
</body>
</html>
